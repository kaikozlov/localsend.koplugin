name: Build KOReader Plugin

on:
  release:
    types:
      - created
  workflow_dispatch:

defaults:
  run:
    working-directory: localsend.koplugin

jobs:
  build:
    name: Build KOReader Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          path: localsend.koplugin
          fetch-depth: 0

      - name: Check out koplugin-dev (shared.just)
        uses: actions/checkout@v7
        with:
          repository: kaikozlov/koplugin-dev
          path: koplugin-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: localsend.koplugin/go.sum

      - name: Install just
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build release artifacts
        run: just release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: koplugin-packages
          path: localsend.koplugin/build/*.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: localsend.koplugin/build/*.zip
