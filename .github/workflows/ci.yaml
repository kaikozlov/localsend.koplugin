name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Docker Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull koplugin-dev image
        run: docker pull ghcr.io/kaikozlov/koplugin-dev:v2026.03_4

      - name: Run all tests in koplugin-dev
        run: make test
