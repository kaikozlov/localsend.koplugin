name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: true

      - name: Run unit tests with race detector
        run: go test ./... -race -v -count=1

      - name: Run integration tests with race detector
        run: go test ./internal/localsend/... -tags=integration -race -v -count=1

  test-lua:
    name: Lua Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Pull koplugin-dev image
        run: docker pull ghcr.io/kaikozlov/koplugin-dev:v2026.03_2

      - name: Run Lua tests
        run: |
          docker run --rm \
            -v "$PWD":/opt/plugin \
            -e PLUGIN_NAME=localsend \
            ghcr.io/kaikozlov/koplugin-dev:v2026.03_2 \
            busted-koreader --verbose \
              --helper=/opt/koplugin-dev/commonrequire.lua \
              /opt/plugin/lua/spec/
